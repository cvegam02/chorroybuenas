# Configuración de Edge Functions (Supabase)
# La que está en cada función (functions/<nombre>/config.toml) puede no aplicarse al desplegar;
# esta es la que usa el CLI al hacer deploy.

[functions.webhook-mercadopago]
verify_jwt = false

[functions.transform-loteria]
verify_jwt = false

# Las funciones que llama el navegador validan el JWT ellas mismas (auth.getUser) y deben
# responder al preflight OPTIONS, que no lleva Authorization: por eso verify_jwt = false.
[functions.create-payment-preference]
verify_jwt = false

[functions.credit-payment-on-return]
verify_jwt = false

[functions.create-seasonal-preference]
verify_jwt = false

# Plantilla de correo de confirmación (registro)
# Para proyectos hosted: copia el contenido de supabase/templates/confirmation.html al Dashboard → Authentication → Email Templates
[auth.email.template.confirmation]
subject = "Confirma tu cuenta - Loteria Personalizada"
content_path = "./supabase/templates/confirmation.html"

# Plantilla de correo de recuperación de contraseña
# Para proyectos hosted: se aplica igual que la de confirmación (Dashboard → Authentication → Email Templates → Reset Password)
[auth.email.template.recovery]
subject = "Recupera tu contraseña - chorroybuenas.com.mx"
content_path = "./supabase/templates/recovery.html"
