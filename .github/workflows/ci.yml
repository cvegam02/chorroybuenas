name: CI

# Solo verifica el código. El despliegue lo hace Vercel (ver docs/VERCEL_DEPLOY.md).
on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      # Necesita Docker, por eso corre aquí y no en el build de Vercel.
      - name: Database tests
        run: npm run test:db

      # Sin variables VITE_*: solo comprueba que el proyecto compila.
      - name: Build
        run: npm run build
